<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>SEOUL DSP - Full-Scale Neon Depth Mockups</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02040a;color:#d8f8ff;font-family:-apple-system,'Helvetica Neue','Apple SD Gothic Neo',sans-serif;padding:30px 0 50px;display:flex;flex-direction:column;gap:40px;align-items:center}
h1{font-size:17px;letter-spacing:3px;color:#8fa8bc;font-weight:600}
.win{width:1240px;height:790px;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(165deg,#0b1626 0%,#050a14 58%,#04070d 100%);border:1px solid #16283c;display:flex;flex-direction:column;flex:none}
.tag{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:99;background:#000c;border:1px solid #2a3a50;border-top:none;padding:4px 16px;font-size:11px;letter-spacing:2px;color:#7f95a8;border-radius:0 0 8px 8px}
.topbar{display:flex;align-items:flex-end;gap:14px;padding:16px 22px 8px;position:relative;z-index:2}
.brand{display:flex;align-items:baseline;gap:12px;margin-right:6px}
.title{font-size:27px;font-weight:800;letter-spacing:3px;color:var(--text);text-shadow:0 0 14px var(--accent)}
.sig{font-family:'Snell Roundhand',cursive;font-size:16px;color:var(--accent2);text-shadow:0 0 9px rgba(255,74,216,.55)}
.spacer{flex:1}
.lbl{font-size:8px;letter-spacing:1.6px;color:#5f7488;margin-bottom:4px}
.menu-box{font-family:Menlo,monospace;font-size:11px;letter-spacing:1px;padding:6px 10px;border-radius:5px;min-width:128px;color:var(--accent);background:var(--inset);border:1px solid var(--line);box-shadow:var(--insetShadow);white-space:nowrap}
.btn{font-size:10px;font-weight:700;letter-spacing:1.4px;padding:8px 12px;border-radius:5px;background:var(--btn);border:1px solid var(--line);color:var(--text);box-shadow:var(--btnShadow);white-space:nowrap;align-self:flex-end}
.main{flex:1;display:flex;gap:16px;padding:12px 22px 20px;position:relative;z-index:2;min-height:0}
.panel{border-radius:10px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--panelShadow)}
.wave{flex:1.18;position:relative;padding:12px 16px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.sec{font-size:9px;letter-spacing:2.2px;color:#5f7488}
.secrow{display:flex;justify-content:space-between;margin-bottom:2px}
.seoul{position:absolute;right:12px;top:8px;font-size:28px;font-weight:800;color:var(--accent);opacity:.9;text-shadow:0 0 10px var(--accent),0 0 26px var(--accent);writing-mode:vertical-rl;letter-spacing:10px;z-index:2}
svg{flex:1;width:100%;margin-top:6px;min-height:0}
.wave-info{display:flex;gap:8px;margin-top:8px}
.chip{font-family:Menlo,monospace;font-size:10px;letter-spacing:1px;padding:3px 9px;border-radius:4px;background:var(--inset);border:1px solid var(--line);color:var(--accent);box-shadow:var(--insetShadow)}
.right{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.knobs{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 4px}
.knob{display:flex;flex-direction:column;align-items:center;gap:6px}
.kcap{width:48px;height:48px;border-radius:50%;position:relative;background:radial-gradient(circle at 33% 28%,var(--capHi),var(--cap) 60%,var(--capLo));box-shadow:var(--knobShadow)}
.ind{position:absolute;inset:0;border-radius:50%;transform:rotate(var(--rot))}
.ind::before{content:"";position:absolute;top:5px;left:calc(50% - 2px);width:4px;height:13px;border-radius:2px;background:var(--accent);box-shadow:0 0 7px var(--accent)}
.klabel{font-size:7.5px;letter-spacing:1px;color:#6d8296;text-align:center;white-space:nowrap}
.combos{display:flex;gap:10px;margin-top:10px}
.env{flex:1;padding:10px 16px 12px;display:flex;flex-direction:column;min-height:0}
.sliders{flex:1;display:grid;grid-template-columns:repeat(8,1fr);gap:12px;margin-top:8px;min-height:0}
.sl{display:flex;flex-direction:column;align-items:center}
.track{flex:1;width:8px;border-radius:4px;background:var(--inset);box-shadow:var(--insetShadow);position:relative}
.fill{position:absolute;bottom:0;left:0;right:0;border-radius:4px;background:linear-gradient(180deg,var(--accent),var(--accent2));box-shadow:0 0 9px var(--accent)}
.thumb{position:absolute;left:50%;transform:translate(-50%,50%);width:22px;height:12px;border-radius:4px;background:linear-gradient(180deg,var(--capHi),var(--cap));border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.65)}
.v1{--text:#d8f8ff;--accent:#39d0d8;--accent2:#ff4ad8;--panel:rgba(255,255,255,.055);--line:rgba(255,255,255,.14);--panelShadow:0 18px 42px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.22);--inset:rgba(0,0,0,.45);--insetShadow:inset 0 2px 8px rgba(0,0,0,.7);--btn:rgba(255,255,255,.08);--btnShadow:0 6px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2);--cap:#16303f;--capHi:#3b5871;--capLo:#0c1c28;--knobShadow:0 6px 14px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.25)}
.v1 .glass{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.02) 30%,transparent 48%);pointer-events:none;z-index:1}
.v2{--text:#c9ffe9;--accent:#45ffd2;--accent2:#39d0d8;--panel:#04110c;--line:#123326;--panelShadow:inset 0 0 70px rgba(0,0,0,.8),0 12px 30px rgba(0,0,0,.6);--inset:#020a07;--insetShadow:inset 0 0 14px rgba(0,0,0,.9),inset 0 0 3px rgba(69,255,210,.15);--btn:#06231a;--btnShadow:0 0 12px rgba(69,255,210,.25),inset 0 1px 0 rgba(69,255,210,.15);--cap:#0a241c;--capHi:#17453a;--capLo:#04120d;--knobShadow:0 0 14px rgba(69,255,210,.3),0 4px 10px rgba(0,0,0,.6)}
.v2 .crt{position:absolute;inset:0;pointer-events:none;background:radial-gradient(140% 130% at 50% 45%,transparent 60%,rgba(0,0,0,.55) 100%);z-index:3}
.v2 .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px);z-index:4;opacity:.5}
.v3{--text:#f2e6ff;--accent:#b26bff;--accent2:#ff4ad8;--panel:rgba(30,16,58,.55);--line:rgba(200,150,255,.3);--panelShadow:0 16px 36px rgba(0,0,0,.6),0 0 24px rgba(160,107,255,.12),inset 0 1px 0 rgba(255,255,255,.14);--inset:rgba(8,4,20,.6);--insetShadow:inset 0 2px 10px rgba(0,0,0,.8),inset 0 0 8px rgba(178,107,255,.1);--btn:rgba(80,40,140,.4);--btnShadow:0 0 14px rgba(178,107,255,.3),inset 0 1px 0 rgba(255,200,255,.25);--cap:#241646;--capHi:#46297e;--capLo:#120a26;--knobShadow:0 0 16px rgba(178,107,255,.4),0 5px 12px rgba(0,0,0,.6)}
.v3 .sheen{position:absolute;inset:-45%;background:conic-gradient(from 0deg,rgba(160,107,255,.14),rgba(74,232,240,.11),rgba(255,90,217,.14),rgba(160,107,255,.14));animation:spin 9s linear infinite;z-index:1;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.v4{--text:#d8ffe9;--accent:#4ce0a0;--accent2:#39d0d8;--panel:#081812;--line:#123a2a;--panelShadow:inset 0 3px 12px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.05);--inset:#03100b;--insetShadow:inset 0 3px 9px rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.06);--btn:#0a241a;--btnShadow:inset 0 2px 6px rgba(0,0,0,.8),0 1px 0 rgba(120,255,190,.08);--cap:#0d221a;--capHi:#1e4a38;--capLo:#071510;--knobShadow:0 5px 11px rgba(0,0,0,.65),inset 0 1px 1px rgba(140,255,200,.2)}
.v4 .leds{display:flex;gap:7px;align-self:flex-end}
.v4 .led{width:7px;height:7px;border-radius:50%;background:#0c2a1e;box-shadow:inset 0 1px 2px rgba(0,0,0,.9)}
.v4 .led.on{background:var(--accent);box-shadow:0 0 8px var(--accent),0 0 16px var(--accent)}
</style></head>
<body>
<h1>SEOUL DSP &mdash; FULL-SCALE NEON DEPTH MOCKUPS (21 knobs / 8 sliders / waveform)</h1>
<div id="stack"></div>
<script>
var VARIANTS=[
 {c:"v1",name:"V1 GLASS DEPTH / NEON SEOUL"},
 {c:"v2",name:"V2 CRT PHOSPHOR / HAN RIVER TERMINAL"},
 {c:"v3",name:"V3 HOLOGRAPHIC / N-SEOUL PRISM"},
 {c:"v4",name:"V4 LED RECESSED / JONGNO SIGNAGE"}
];
var KO=[["OSC1 POS",35],["OSC2 POS",62],["OSC3 POS",18],["OSC1 DT",44],["OSC2 DT",71],["OSC3 DT",28],["KEY TRK",55]];
var KF=[["CUTOFF",64],["RESO",38],["DRIVE",22],["SAT",47],["ENV AMT",58],["OUTPUT",76]];
var ENV=[82,64,38,90,55,30,72,45];
function knob(l,v){var r=(-135+v*2.7).toFixed(1);return '<div class="knob"><div class="kcap"><div class="ind" style="--rot:'+r+'deg"></div></div><div class="klabel">'+l+'</div></div>';}
function slider(v){var p=Math.max(6,Math.min(94,v));return '<div class="sl"><div class="track"><div class="fill" style="height:'+p+'%"></div><div class="thumb" style="bottom:'+p+'%"></div></div></div>';}
function buildWindow(v){
 var osc=KO.map(function(k){return knob(k[0],k[1]);}).join("");
 var fx=KF.map(function(k){return knob(k[0],k[1]);}).join("");
 var env=ENV.map(slider).join("");
 var led=(v.c==="v4")?'<div class="leds"><div class="led on"></div><div class="led"></div><div class="led on"></div><div class="led on"></div></div>':"";
 var o="";
 if(v.c==="v1")o='<div class="glass"></div>';
 if(v.c==="v2")o='<div class="crt"></div><div class="scan"></div>';
 if(v.c==="v3")o='<div class="sheen"></div>';
 var fid="g_"+v.c;
 var w ='<div class="win '+v.c+'">';
 w+='<div class="tag">'+v.name+'</div>'+o;
 w+='<div class="topbar"><div class="brand"><div class="title">SEOUL DSP</div><div class="sig">aoi yume</div></div>';
 w+='<div><div class="lbl">FACTORY // RANDOM BANK</div><div class="menu-box">STACK 11 // FIFTHS</div></div>';
 w+='<div><div class="lbl">UI TYPE</div><div class="menu-box">NEON HAN // L01</div></div>';
 w+='<div><div class="lbl">MIDI LEARN</div><div class="menu-box">CUTOFF</div></div>';
 w+='<div class="btn">LEARN CC</div><div class="spacer"></div>'+led;
 w+='<div class="btn">LOAD AUDIO</div><div class="btn">SAVE PRESET</div><div class="btn">LOAD PRESET</div></div>';
 w+='<div class="main"><div class="wave panel"><div class="secrow"><div class="sec">WAVETABLE</div></div><div class="seoul">서울</div>';
 w+='<svg viewBox="0 0 640 190" preserveAspectRatio="none">';
 w+='<defs><filter id="'+fid+'" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
 w+='<line x1="224" y1="8" x2="224" y2="182" stroke="var(--accent2)" stroke-width="1" opacity="0.6" filter="url(#'+fid+')"/>';
 w+='<path d="M0,95 C60,35 120,35 180,95 C240,155 300,155 360,95 C420,35 480,35 540,95 C580,135 620,135 640,115" fill="none" stroke="var(--accent)" stroke-width="2.4" filter="url(#'+fid+')"/>';
 w+='<path d="M0,150 L90,60 L180,150 L270,60 L360,150 L450,60 L540,150 L630,60 L640,72" fill="none" stroke="var(--accent2)" stroke-width="1.4" opacity="0.55" filter="url(#'+fid+')"/>';
 w+='<path d="M0,95 L40,95 L40,45 L160,45 L160,145 L280,145 L280,45 L400,45 L400,145 L520,145 L520,45 L640,45" fill="none" stroke="#a06bff" stroke-width="1.2" opacity="0.45"/>';
 w+='</svg>';
 w+='<div class="wave-info"><div class="chip">3 OSC</div><div class="chip">16 VOICE</div><div class="chip">POS 0.35</div><div class="chip">UNI 8</div></div></div>';
 w+='<div class="right"><div class="panel" style="padding:10px 14px 12px"><div class="secrow"><div class="sec">OSCILLATOR</div><div class="sec">FILTER</div></div>';
 w+='<div class="knobs">'+osc+fx+'</div>';
 w+='<div class="combos"><div style="flex:1"><div class="lbl">FILTER TYPE</div><div class="menu-box" style="min-width:0">LP 24</div></div><div style="flex:1"><div class="lbl">SLOPE</div><div class="menu-box" style="min-width:0">12 dB/OCT</div></div></div></div>';
 w+='<div class="env panel"><div class="sec">ENVELOPE</div><div class="sliders">'+env+'</div></div></div></div></div>';
 return w;
}
document.getElementById("stack").innerHTML=VARIANTS.map(buildWindow).join("<div style='height:26px'></div>");
</script></body></html>
